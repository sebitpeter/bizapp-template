openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 1.0.0
  description: |
    Storefront API (white-label). Endpoints marked with `cookieAuth` require an
    admin session cookie obtained from POST /auth/login. Image uploads
    (POST /admin/uploads, GET /media/{id}) are binary endpoints implemented
    by hand in the API server (see artifacts/api-server/src/routes/media.ts).
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: auth
    description: Admin sign-in (single shared admin password from ADMIN_PASSWORD)
  - name: settings
    description: Business branding & settings
  - name: products
    description: Product catalog
  - name: orders
    description: Customer orders and fulfillment
  - name: content
    description: Editable storefront copy
  - name: dashboard
    description: Admin analytics
  - name: reviews
    description: Customer reviews
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Sign in as admin (sets an httpOnly session cookie)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          description: Too many attempts
  /auth/session:
    get:
      operationId: getSession
      tags: [auth]
      summary: Is the current browser signed in as admin?
      responses:
        "200":
          description: Session state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Sign out (clears the session cookie)
      responses:
        "200":
          description: Signed out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
  /settings:
    get:
      operationId: getSiteSettings
      tags: [settings]
      summary: Public business settings (branding, contact, currency...)
      responses:
        "200":
          description: Current settings (defaults merged with admin overrides)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SiteSettings"
    put:
      operationId: updateSiteSettings
      tags: [settings]
      summary: Save business settings
      security: [{ cookieAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SiteSettings"
      responses:
        "200":
          description: Saved settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SiteSettings"
        "401":
          $ref: "#/components/responses/Unauthorized"
    delete:
      operationId: resetSiteSettings
      tags: [settings]
      summary: Reset settings to the defaults in business.config.ts
      security: [{ cookieAuth: [] }]
      responses:
        "200":
          description: Default settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SiteSettings"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /products:
    get:
      operationId: listProducts
      tags: [products]
      summary: List products
      parameters:
        - name: category
          in: query
          required: false
          schema:
            type: string
            maxLength: 40
        - name: search
          in: query
          required: false
          schema:
            type: string
            maxLength: 100
      responses:
        "200":
          description: Product list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Product"
    post:
      operationId: createProduct
      tags: [products]
      summary: Create a product
      security: [{ cookieAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductInput"
      responses:
        "201":
          description: Created product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /products/{id}:
    get:
      operationId: getProduct
      tags: [products]
      summary: Get a product
      parameters:
        - $ref: "#/components/parameters/ProductId"
      responses:
        "200":
          description: Product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateProduct
      tags: [products]
      summary: Update a product
      security: [{ cookieAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/ProductId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductUpdate"
      responses:
        "200":
          description: Updated product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "401":
          $ref: "#/components/responses/Unauthorized"
    delete:
      operationId: deleteProduct
      tags: [products]
      summary: Delete a product
      security: [{ cookieAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/ProductId"
      responses:
        "204":
          description: Product deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
  /orders:
    get:
      operationId: listOrders
      tags: [orders]
      summary: List recent orders (contains customer personal data — admin only)
      security: [{ cookieAuth: [] }]
      parameters:
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/OrderStatus"
        - name: paymentStatus
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/PaymentStatus"
        - name: search
          in: query
          required: false
          description: Order code, customer name or phone
          schema: { type: string, maxLength: 60 }
      responses:
        "200":
          description: Order list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Order"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createOrder
      tags: [orders]
      summary: Place a customer order (prices are looked up on the server)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderInput"
      responses:
        "201":
          description: Order receipt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderReceipt"
        "400":
          description: Invalid order (unknown or unavailable product, bad quantity...)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /orders/{id}/status:
    patch:
      operationId: updateOrderStatus
      tags: [orders]
      summary: Update order fulfillment status
      security: [{ cookieAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderStatusUpdate"
      responses:
        "200":
          description: Updated order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /content:
    get:
      operationId: listContent
      tags: [content]
      summary: List editable storefront content
      responses:
        "200":
          description: Content entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ContentEntry"
  /content/{key}:
    patch:
      operationId: updateContent
      tags: [content]
      summary: Update an existing storefront content block
      security: [{ cookieAuth: [] }]
      parameters:
        - name: key
          in: path
          required: true
          schema:
            type: string
            pattern: "^[a-z0-9_]{1,40}$"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContentUpdate"
      responses:
        "200":
          description: Updated content entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContentEntry"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Get dashboard metrics
      security: [{ cookieAuth: [] }]
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /reviews:
    get:
      operationId: listReviews
      tags: [reviews]
      summary: List customer reviews
      responses:
        "200":
          description: Review list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Review"
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: sid
  parameters:
    ProductId:
      name: id
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
  responses:
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Not signed in as admin
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Error:
      type: object
      properties:
        error:
          type: string
      required: [error]
    LoginInput:
      type: object
      required: [username, email, password]
      properties:
        username: { type: string, minLength: 1, maxLength: 64 }
        email: { type: string, minLength: 1, maxLength: 254 }
        password: { type: string, minLength: 1, maxLength: 200 }
    AuthUser:
      type: object
      required: [id, username, email, name, role, mustChangePassword]
      properties:
        id: { type: integer }
        username: { type: string }
        email: { type: string }
        name: { type: string }
        role: { type: string, enum: [owner, manager, staff] }
        mustChangePassword: { type: boolean }
    AuthSession:
      type: object
      required: [authenticated]
      properties:
        authenticated: { type: boolean }
        user: { $ref: "#/components/schemas/AuthUser" }
        permissions:
          type: array
          items: { type: string }
        csrfToken:
          type: string
          description: Send back in the X-CSRF-Token header on every change (POST/PUT/PATCH/DELETE).
        expiresAt: { type: ["string", "null"] }
        setupRequired:
          type: boolean
          description: true when no staff account exists yet (first run)
        setupNeedsToken: { type: boolean }
        oauth:
          type: object
          required: [google, github]
          properties:
            google: { type: boolean }
            github: { type: boolean }
    SiteSettings:
      type: object
      description: Full validation rules live in business/src/schema.ts (shared by API and admin UI).
      required: [name, tagline, logoUrl, faviconUrl, heroImageUrl, colors, contact, socials, hours, currency, categories, seo, checkout]
      properties:
        checkout:
          $ref: "#/components/schemas/CheckoutSettings"
        name: { type: string, maxLength: 60 }
        tagline: { type: string, maxLength: 80 }
        logoUrl: { type: string, maxLength: 500 }
        faviconUrl: { type: string, maxLength: 500 }
        heroImageUrl: { type: string, maxLength: 500 }
        colors:
          type: object
          required: [primary, accent, ink, background, surface]
          properties:
            primary: { type: string }
            accent: { type: string }
            ink: { type: string }
            background: { type: string }
            surface: { type: string }
        contact:
          type: object
          required: [email, phone, whatsapp, address, city, mapUrl]
          properties:
            email: { type: string }
            phone: { type: string }
            whatsapp: { type: string }
            address: { type: string }
            city: { type: string }
            mapUrl: { type: string }
        socials:
          type: object
          required: [instagram, facebook, x, tiktok, website]
          properties:
            instagram: { type: string }
            facebook: { type: string }
            x: { type: string }
            tiktok: { type: string }
            website: { type: string }
        hours:
          type: array
          maxItems: 10
          items:
            type: object
            required: [label, value]
            properties:
              label: { type: string }
              value: { type: string }
        currency:
          type: object
          required: [code, locale]
          properties:
            code: { type: string }
            locale: { type: string }
        categories:
          type: array
          maxItems: 20
          items: { type: string }
        seo:
          type: object
          required: [title, description]
          properties:
            title: { type: string }
            description: { type: string }
    CheckoutSettings:
      type: object
      description: Payment methods, delivery zones and pickup (validated by business/src/schema.ts).
      required: [methods, phoneCountryCode, delivery, pickup, minOrder]
      properties:
        methods:
          type: object
          required: [cod, flutterwave, pesapal]
          properties:
            cod: { type: boolean }
            flutterwave: { type: boolean }
            pesapal: { type: boolean }
        phoneCountryCode: { type: string }
        delivery:
          type: object
          required: [enabled, zones, freeOver, note]
          properties:
            enabled: { type: boolean }
            zones:
              type: array
              maxItems: 40
              items:
                type: object
                required: [id, name, fee]
                properties:
                  id: { type: string }
                  name: { type: string }
                  fee: { type: number }
            freeOver: { type: number }
            note: { type: string }
        pickup:
          type: object
          required: [enabled, address, note]
          properties:
            enabled: { type: boolean }
            address: { type: string }
            note: { type: string }
        minOrder: { type: number }
    Product:
      type: object
      required: [id, name, slug, category, price, description, imageUrl, rating, reviewCount, ingredients, tags, available]
      properties:
        id: { type: integer }
        name: { type: string }
        slug: { type: string }
        category: { type: string }
        price: { type: number }
        description: { type: string }
        imageUrl: { type: string }
        rating: { type: number }
        reviewCount: { type: integer }
        ingredients:
          type: array
          items: { type: string }
        tags:
          type: array
          items: { type: string }
        available: { type: boolean }
        stock:
          type: ["integer", "null"]
          description: Units left. null = stock not tracked.
    ProductInput:
      type: object
      required: [name, slug, category, price, description, imageUrl]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        slug: { type: string, pattern: "^[a-z0-9-]{1,120}$" }
        category: { type: string, minLength: 1, maxLength: 40 }
        price: { type: number, minimum: 0, maximum: 1000000 }
        description: { type: string, maxLength: 2000 }
        imageUrl: { type: string, maxLength: 500 }
        ingredients:
          type: array
          maxItems: 50
          items: { type: string, maxLength: 80 }
        tags:
          type: array
          maxItems: 20
          items: { type: string, maxLength: 40 }
        available: { type: boolean }
        stock: { type: ["integer", "null"], minimum: 0, maximum: 1000000 }
    ProductUpdate:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        slug: { type: string, pattern: "^[a-z0-9-]{1,120}$" }
        category: { type: string, minLength: 1, maxLength: 40 }
        price: { type: number, minimum: 0, maximum: 1000000 }
        description: { type: string, maxLength: 2000 }
        imageUrl: { type: string, maxLength: 500 }
        ingredients:
          type: array
          maxItems: 50
          items: { type: string, maxLength: 80 }
        tags:
          type: array
          maxItems: 20
          items: { type: string, maxLength: 40 }
        available: { type: boolean }
        stock: { type: ["integer", "null"], minimum: 0, maximum: 1000000 }
    OrderStatus:
      type: string
      enum: [Pending, Confirmed, Preparing, "Ready for Pickup", "Out for Delivery", Completed, Cancelled]
    PaymentStatus:
      type: string
      enum: [pending, paid, failed, refunded]
    HistoryEntry:
      type: object
      required: [at, type, value]
      properties:
        at: { type: string }
        type: { type: string, enum: [status, payment, note] }
        value: { type: string }
        by: { type: string }
    OrderLine:
      type: object
      description: A line on a saved order. Name and unitPrice are copied from the product at order time.
      required: [productId, name, quantity, unitPrice]
      properties:
        productId: { type: integer }
        name: { type: string }
        quantity: { type: integer }
        unitPrice: { type: number }
    OrderItemInput:
      type: object
      description: What the customer sends. Prices are NEVER accepted from the client.
      required: [productId, quantity]
      properties:
        productId: { type: integer, minimum: 1 }
        quantity: { type: integer, minimum: 1, maximum: 50 }
    Order:
      type: object
      required: [id, code, customerName, customerEmail, customerPhone, items, subtotal, deliveryFee, total, currency, fulfillment, status, paymentMethod, paymentStatus, history, createdAt]
      properties:
        id: { type: integer }
        code: { type: ["string", "null"] }
        customerName: { type: string }
        customerEmail: { type: string }
        customerPhone: { type: string }
        items:
          type: array
          items: { $ref: "#/components/schemas/OrderLine" }
        subtotal: { type: number }
        deliveryFee: { type: number }
        total: { type: number }
        currency: { type: string }
        fulfillment: { type: string, enum: [delivery, pickup] }
        deliveryZone: { type: ["string", "null"] }
        deliveryAddress: { type: ["string", "null"] }
        status:
          $ref: "#/components/schemas/OrderStatus"
        paymentMethod: { type: string }
        paymentStatus: { $ref: "#/components/schemas/PaymentStatus" }
        paidAt: { type: ["string", "null"] }
        history:
          type: array
          items: { $ref: "#/components/schemas/HistoryEntry" }
        createdAt: { type: string }
        deliveryNote: { type: ["string", "null"] }
    OrderReceipt:
      type: object
      description: What a customer gets back after ordering (no other customers' data).
      required: [code, accessToken, total, currency, status, paymentMethod, paymentStatus, checkoutUrl]
      properties:
        code: { type: string }
        accessToken:
          type: string
          description: Secret that lets this browser view the order without typing the phone number. Keep private.
        total: { type: number }
        currency: { type: string }
        status: { $ref: "#/components/schemas/OrderStatus" }
        paymentMethod: { type: string }
        paymentStatus: { $ref: "#/components/schemas/PaymentStatus" }
        checkoutUrl:
          type: ["string", "null"]
          description: For online payments, send the customer here to pay.
    OrderInput:
      type: object
      required: [customerName, customerPhone, items, fulfillment, paymentMethod]
      properties:
        customerName: { type: string, minLength: 1, maxLength: 100 }
        customerPhone: { type: string, minLength: 6, maxLength: 30 }
        customerEmail: { type: string, maxLength: 254 }
        items:
          type: array
          minItems: 1
          maxItems: 30
          items: { $ref: "#/components/schemas/OrderItemInput" }
        fulfillment: { type: string, enum: [delivery, pickup] }
        deliveryZoneId: { type: string, maxLength: 40 }
        deliveryAddress: { type: string, maxLength: 300 }
        deliveryNote: { type: string, maxLength: 500 }
        paymentMethod: { type: string, enum: [cod, flutterwave, pesapal] }
        website:
          type: string
          maxLength: 200
          description: Honeypot. Must be empty (bots fill it).
    OrderStatusUpdate:
      type: object
      required: [status]
      properties:
        status:
          $ref: "#/components/schemas/OrderStatus"
    ContentEntry:
      type: object
      required: [key, value, label]
      properties:
        key: { type: string }
        value: { type: string }
        label: { type: string }
    ContentUpdate:
      type: object
      required: [value]
      properties:
        value: { type: string, maxLength: 5000 }
    DashboardSummary:
      type: object
      required: [revenueToday, ordersToday, totalOrders, openOrders, averageOrderValue, bestSellingProduct, revenueTrend]
      properties:
        revenueToday: { type: number }
        ordersToday: { type: integer }
        totalOrders: { type: integer }
        openOrders: { type: integer }
        averageOrderValue: { type: number }
        bestSellingProduct: { type: ["string", "null"] }
        revenueTrend:
          type: array
          description: Revenue for each of the last 7 days (oldest first, server time zone)
          items:
            type: object
            required: [label, value]
            properties:
              label: { type: string }
              value: { type: number }
    Review:
      type: object
      required: [id, customerName, quote, rating, verified]
      properties:
        id: { type: integer }
        customerName: { type: string }
        quote: { type: string }
        rating: { type: integer, minimum: 1, maximum: 5 }
        verified: { type: boolean }
        productName: { type: ["string", "null"] }
        status: { type: string, enum: [approved, pending, hidden] }
        createdAt: { type: string }
